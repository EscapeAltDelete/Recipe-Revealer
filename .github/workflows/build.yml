name: Recipe Revealer

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      MOD_VERSION: 1.0.0-${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-excludes: caches/fabric-loom
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Software graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
      - name: Build and test
        timeout-minutes: 5
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew build runClientGameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_FORCE_EGL: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: recipe-revealer
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/screenshots/
      - name: Publish GitHub package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
