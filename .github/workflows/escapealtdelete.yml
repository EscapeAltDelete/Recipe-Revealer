name: EscapeAltDelete

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: EscapeAltDelete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escapealtdelete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      ESCAPEALTDELETE_VERSION: 1.0.0-${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: EscapeAltDelete
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Test in Minecraft
        run: xvfb-run -a ./gradlew -Pgametest runClientGameTest --build-cache
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EscapeAltDelete-diagnostics
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/screenshots/
      - name: Publish GitHub package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ./gradlew publish --build-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
