plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
    id 'maven-publish'
}

group = 'recipe_revealer'
version = providers.environmentVariable('MOD_VERSION').getOrElse('1.0.0')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}

jar {
    from 'LICENSE', 'NOTICE'
}

// This source set and its dependencies are never shipped.
fabricApi.configureTests {
    createSourceSet = true
    enableGameTests = false
}

tasks.named('runClientGameTest') {
    useXvfb = false
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    gametestImplementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
}

publishing {
    publications {
        mod(MavenPublication) {
            from components.java
            artifactId = 'recipe-revealer'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/EscapeAltDelete/Recipe-Revealer'
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').orNull
                password = providers.environmentVariable('GITHUB_TOKEN').orNull
            }
        }
    }
}
